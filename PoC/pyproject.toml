[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prova-conceito"
version = "1.0.7"
description = "TCC — Aprendizado Federado para Previsão de Temperatura com LSTM"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]>=1.28.0",
    "torch>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

# ---------------------------------------------------------------------------
# Configuração do Flower
# ---------------------------------------------------------------------------

[tool.flwr.app]
publisher = "tcc"

[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"

# ---------------------------------------------------------------------------
# Parâmetros da simulação
# ---------------------------------------------------------------------------

[tool.flwr.app.config]
num-server-rounds = 30
strategy = "fedavg"
local-epochs = 1
batch-size = 64
lr = 0.0005
fraction-fit = 1.0
fraction-evaluate = 1.0

# ---------------------------------------------------------------------------
# Perfil de federação local (simulação com 2 estações)
# ---------------------------------------------------------------------------


